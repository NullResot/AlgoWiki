services:
  db:
    profiles: ["local-db"]
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: ${MYSQL_SERVER_ARGS:---character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-algowiki}
      MYSQL_USER: ${MYSQL_USER:-algowiki}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-ghcr.io/nullresot/algowiki-redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-96mb}",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    init: true
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.15}
    pids_limit: ${REDIS_PIDS_LIMIT:-64}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ${APP_IMAGE:-algowiki-web:local}
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${APP_ENV_FILE:-deploy/.env.production}
    restart: unless-stopped
    init: true
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    cpus: ${WEB_CPU_LIMIT:-1.25}
    pids_limit: ${WEB_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
      ALGOWIKI_RELEASE: ${ALGOWIKI_RELEASE:-server}
      DJANGO_SERVE_FRONTEND: 1
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-0}
      DJANGO_USE_X_FORWARDED_PORT: ${DJANGO_USE_X_FORWARDED_PORT:-0}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
      DB_ENGINE: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-algowiki}
      DB_USER: ${DB_USER:-algowiki}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-300}
      MEDIA_ROOT: /app/backend/media
      MEDIA_URL: ${MEDIA_URL:-/media/}
      FRONTEND_DIST_DIR: /app/frontend/dist
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-replace-with-a-random-password}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@example.com}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-2}
      DJANGO_LOG_DIR: /app/storage/logs
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8001}:8001"
    volumes:
      - media_data:/app/backend/media
      - storage_data:/app/storage
      - ${APP_LOG_DIR:-/srv/algowiki/storage/logs}:/app/storage/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8001/api/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  moderation-worker:
    image: ${APP_IMAGE:-algowiki-web:local}
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-deploy/.env.production}
    restart: unless-stopped
    init: true
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}
    cpus: ${WORKER_CPU_LIMIT:-0.35}
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    working_dir: /app/backend
    command: ["python", "manage.py", "process_ai_moderation_queue", "--interval", "30"]
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALGOWIKI_RELEASE: ${ALGOWIKI_RELEASE:-server}
      DB_ENGINE: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-algowiki}
      DB_USER: ${DB_USER:-algowiki}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-300}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEDIA_ROOT: /app/backend/media
      MEDIA_URL: ${MEDIA_URL:-/media/}
      DJANGO_LOG_DIR: /app/storage/logs
    volumes:
      - media_data:/app/backend/media
      - storage_data:/app/storage
      - ${APP_LOG_DIR:-/srv/algowiki/storage/logs}:/app/storage/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import os, sys; probe_pid=str(os.getpid()); sys.exit(0 if any(p.parent.name != probe_pid and b'python\\x00manage.py\\x00process_ai_moderation_queue\\x00' in p.read_bytes() for p in Path('/proc').glob('[0-9]*/cmdline')) else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
  media_data:
  storage_data:
